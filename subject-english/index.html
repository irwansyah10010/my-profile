<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Data Table - English Sentence</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <style>
    table {
      width: 100%;
      margin-top: 1rem;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: #f0f0f0;
    }

    #tableContainer {
      max-width: 960px;
      margin: 2rem auto;
      padding: 1rem;
    }

    #tableContainer h2 {
      margin-bottom: 0.5rem;
    }

    /* efek gelap (blur/blackout) */
    .hidden-col {
      color: transparent !important;
      text-shadow: 0 0 10px #000;
      user-select: none;
    }

    @media (max-width: 700px) {
      body{
        overflow-x: hidden;
      }

      #tableContainer {
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>
  <header>
    <nav>
      <div class="logo">
        <img src="../assets/img/logo/logo.png" alt="Logo" />
      </div>
      <div class="subnav">
        <ul>
          <li><a href="../index.html">HOME</a></li>
          <li><a href="game.html">GUESS THE WORD</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main>
    <div id="tableContainer">
      <h2>Data Table</h2>
      <p>This table is generated from a CSV file.</p>

      <input type="text" id="searchInput" placeholder="Cari..." style="margin-bottom:10px; padding:5px;">

      <!-- tombol untuk gelapkan kolom -->
      <div style="margin:10px 0;">
        <button onclick="toggleColumn(0)">Toggle Kolom 1</button>
        <button onclick="toggleColumn(1)">Toggle Kolom 2</button>
      </div>

      <div id="pagination" style="margin-top:10px;"></div>
    </div>
  </main>

  <footer>
    Copyright &copy; 2025 Irwansyah. All rights reserved.
  </footer>

<script>
  let currentPage = 1;
  const rowsPerPage = 10;
  let globalData = [];
  let filteredData = [];

  fetch('https://irwansyah10010.github.io/my-profile/assets/document/english-sentence.csv')
    .then(response => response.text())
    .then(text => {
      globalData = text.trim().split('\n').map(row => row.replace('\r', '').split(';'));
      filteredData = [...globalData]; 
      render();
    });

  function render() {
    displayTablePage(filteredData, currentPage);
    setupPagination(filteredData);
  }

  function displayTablePage(data, page) {
    const container = document.getElementById('tableContainer');
    container.querySelectorAll('table').forEach(t => t.remove());

    const start = (page - 1) * rowsPerPage + 1; 
    const end = start + rowsPerPage;
    const paginatedData = data.slice(start, end);

    const table = document.createElement('table');

    // Header
    const headerRow = document.createElement('tr');
    data[0].forEach(cell => {
      const th = document.createElement('th');
      th.textContent = cell.trim();
      headerRow.appendChild(th);
    });
    table.appendChild(headerRow);

    // Isi tabel
    paginatedData.forEach(row => {
      const tr = document.createElement('tr');
      row.forEach((cell, idx) => {
        const td = document.createElement('td');
        td.textContent = cell.trim();
        td.dataset.colIndex = idx; // simpan index kolom
        tr.appendChild(td);
      });
      table.appendChild(tr);
    });

    container.insertBefore(table, document.getElementById('pagination'));

    // Terapkan kembali hidden jika ada
    applyHiddenColumns();
  }

  function setupPagination(data) {
    const pagination = document.getElementById('pagination');
    pagination.innerHTML = '';

    const totalPages = Math.ceil((data.length - 1) / rowsPerPage);

    const prevBtn = document.createElement('button');
    prevBtn.textContent = 'Previous';
    prevBtn.disabled = currentPage === 1;
    prevBtn.addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        render();
      }
    });
    pagination.appendChild(prevBtn);

    for (let i = 1; i <= totalPages; i++) {
      const btn = document.createElement('button');
      btn.textContent = i;
      btn.style.fontWeight = (i === currentPage) ? 'bold' : 'normal';
      btn.style.backgroundColor = (i === currentPage) ? '#007bff' : '';
      btn.style.color = (i === currentPage) ? '#fff' : '';
      btn.addEventListener('click', () => {
        currentPage = i;
        render();
      });
      pagination.appendChild(btn);
    }

    const nextBtn = document.createElement('button');
    nextBtn.textContent = 'Next';
    nextBtn.disabled = currentPage === totalPages;
    nextBtn.addEventListener('click', () => {
      if (currentPage < totalPages) {
        currentPage++;
        render();
      }
    });
    pagination.appendChild(nextBtn);
  }

  // Filter pencarian
  document.getElementById('searchInput').addEventListener('input', function () {
    const keyword = this.value.toLowerCase();

    filteredData = globalData.filter((row, index) => {
      if (index === 0) return true;
      return row.some(cell => cell.toLowerCase().includes(keyword));
    });

    currentPage = 1;
    render();
  });

  // -----------------------------
  // Fitur gelapkan kolom
  // -----------------------------
  let hiddenColumns = new Set();

  function toggleColumn(colIndex) {
    if (hiddenColumns.has(colIndex)) {
      hiddenColumns.delete(colIndex);
    } else {
      hiddenColumns.add(colIndex);
    }
    applyHiddenColumns();
  }

  function applyHiddenColumns() {
    document.querySelectorAll('td').forEach(td => {
      const colIndex = parseInt(td.dataset.colIndex, 10);
      if (hiddenColumns.has(colIndex)) {
        td.classList.add('hidden-col');
      } else {
        td.classList.remove('hidden-col');
      }
    });
  }
</script>

</body>
</html>
